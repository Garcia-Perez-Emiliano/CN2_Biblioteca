{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">

  <div class="col-lg-8">

    <div class="card shadow-sm">

      <div class="card-header bg-white">
        <h4 class="mb-0">
          {{ 'Editar lector' if lector else 'Nuevo lector' }}
        </h4>
      </div>

      <div class="card-body">

        <form method="post">

          <div class="row g-3">

            <div class="col-md-6">
              <label class="form-label">Nombre *</label>

              <input
                type="text"
                name="nombre"
                maxlength="100"
                required
                class="form-control"
                value="{{ datos.get('nombre', '') }}">
            </div>

            <div class="col-md-6">
              <label class="form-label">Apellidos *</label>

              <input
                type="text"
                name="apellidos"
                maxlength="100"
                required
                class="form-control"
                value="{{ datos.get('apellidos', '') }}">
            </div>

            <div class="col-md-6">
              <label class="form-label">Correo *</label>

              <input
                type="email"
                name="correo"
                maxlength="120"
                required
                class="form-control"
                value="{{ datos.get('correo', '') }}">
            </div>

            <div class="col-md-6">
              <label class="form-label">Teléfono</label>

              <input
                type="text"
                name="telefono"
                maxlength="20"
                class="form-control"
                value="{{ datos.get('telefono', '') }}">
            </div>

            <div class="col-md-6">
              <label class="form-label">Matrícula *</label>

              <input
                type="text"
                name="matricula"
                maxlength="30"
                required
                class="form-control"
                value="{{ datos.get('matricula', '') }}">
            </div>

            <div class="col-md-6 d-flex align-items-end">

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="activo"
                  id="activo"
                  {% if datos.get('activo', True) %}checked{% endif %}>

                <label class="form-check-label" for="activo">
                  Lector activo
                </label>
              </div>

            </div>

          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">

            <a href="{{ url_for('lectores.index') }}"
               class="btn btn-outline-secondary">
               Cancelar
            </a>

            <button type="submit"
                    class="btn btn-primary">
                Guardar
            </button>

          </div>

        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
